<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartSeat Login</title>
  <link rel="stylesheet" href="style.css">
   <div class="MyVideo">
    <video autoplay muted loop id="MyVideo">
    <source src="BRIDGESTONE X VICTORY LINER - Bridgestone Philippines (1080p, h264).mp4" type="video/mp4">
    Your browser does not support the video tag
</video>
</head>
<body>
  <div class="login-container">
    <h2>SMART SEAT SYSTEM</h2>
    <p>Passenger Login</p>
    <form>
      <div class="input-group">
        <label for="code">Reservation Code</label>
        <input type="text" id="code" name="code" placeholder="Enter your reservation code" required>
      </div>
      <button type="submit">Login</button>
      <p class="note">Enter your unique code! :></p>
    </form>
  </div>
</body>

</html>
